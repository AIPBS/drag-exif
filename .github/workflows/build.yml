name: Build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'linux/**'
      - 'scripts/**'
      - 'windows/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        run: |
          DART_CONSTRAINT=$(grep '^  sdk:' pubspec.yaml | sed 's/.*sdk: //')
          DART_VERSION=${DART_CONSTRAINT#\^}
          FLUTTER_VERSION=$(grep "^$DART_VERSION:" .flutter-versions | cut -d: -f2 | xargs)
          echo "dart=$DART_VERSION" >> $GITHUB_OUTPUT
          echo "flutter=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.flutter }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Cache ExifTool source archive
        id: exiftool-source-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Image-ExifTool-13.59.tar.gz
          key: exiftool-source-13.59

      - name: Download ExifTool source archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Image-ExifTool-13.59.tar.gz"
          url="https://github.com/exiftool/exiftool/archive/refs/tags/13.59.tar.gz"
          expected='87d3317882fdae9cb4dcfe57a96a378d0132ffc02c731315bf128b19ddcf7aac'
          if [ "${{ steps.exiftool-source-cache.outputs.cache-hit }}" != true ]; then
            curl -fsSL --retry 3 --retry-all-errors -o "$archive" "$url"
          fi
          test -s "$archive"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          test "$actual" = "$expected"

      - name: Analyze
        run: flutter analyze

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package Linux build
        run: |
          cd build/linux/x64/release
          tar czf "$(git rev-parse --show-toplevel)/dragexif-linux.tar.gz" bundle/

      - name: Prepare standalone ExifTool bundle
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Image-ExifTool-13.59.tar.gz"
          ./scripts/package_linux_standalone.sh "$archive" \
            "$(git rev-parse --show-toplevel)/dragexif-linux_standalone.tar.gz"

      - name: Package standalone Linux build
        run: test -s dragexif-linux_standalone.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragexif-linux
          path: dragexif-linux.tar.gz

      - name: Upload standalone Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragexif-linux-standalone
          path: dragexif-linux_standalone.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        shell: bash
        run: |
          DART_CONSTRAINT=$(grep '^  sdk:' pubspec.yaml | sed 's/.*sdk: //')
          DART_VERSION=${DART_CONSTRAINT#\^}
          FLUTTER_VERSION=$(grep "^$DART_VERSION:" .flutter-versions | cut -d: -f2 | xargs)
          echo "dart=$DART_VERSION" >> $GITHUB_OUTPUT
          echo "flutter=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.flutter }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Cache ExifTool archive
        id: exiftool-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/exiftool-13.59-64.zip
          key: exiftool-13.59-64-windows

      - name: Download ExifTool
        shell: pwsh
        run: |
          $version = '13.59'
          $archive = Join-Path $env:RUNNER_TEMP "exiftool-$version-64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "exiftool-$version-64"
          $url = "https://oliverbetz.de/cms/files/Artikel/ExifTool-for-Windows/exiftool-${version}_64.zip"
          $expectedSha256 = '577257dd22baebe77157d905792d6ed2c5916cd03aa627f40b2175db12110ac6'

          if ('${{ steps.exiftool-cache.outputs.cache-hit }}' -ne 'true') {
            Invoke-WebRequest -Uri $url -OutFile $archive
          }
          if (-not (Test-Path $archive)) {
            throw 'The ExifTool archive was not available after cache/download.'
          }
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "ExifTool checksum mismatch: $actualSha256"
          }

          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $exifTool = Get-ChildItem -Path $extract -Filter 'ExifTool.exe' -Recurse | Select-Object -First 1
          $exifToolFiles = Get-ChildItem -Path $extract -Directory -Filter 'exiftool_files' -Recurse | Select-Object -First 1
          if ($null -eq $exifTool -or $null -eq $exifToolFiles) {
            throw 'The ExifTool archive did not contain the expected executable and support directory.'
          }

          $bundle = Join-Path $PWD 'windows/runner/exiftool'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item $exifTool.FullName (Join-Path $bundle 'exiftool.exe') -Force
          Copy-Item $exifToolFiles.FullName (Join-Path $bundle 'exiftool_files') -Recurse -Force

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Stage MSIX build
        run: |
          # Build already outputs to build/windows/x64/runner/Release/
          if (-not (Test-Path "build/windows/x64/runner/Release/Drag Exif.exe")) {
            Write-Host "Drag Exif.exe not found in build/windows/x64/runner/Release/" -ForegroundColor Red
            exit 1
          }
          if (-not (Test-Path "build/windows/x64/runner/Release/exiftool.exe")) {
            Write-Host "exiftool.exe not found in the Windows bundle" -ForegroundColor Red
            exit 1
          }
          if (-not (Test-Path "build/windows/x64/runner/Release/exiftool_files")) {
            Write-Host "exiftool_files not found in the Windows bundle" -ForegroundColor Red
            exit 1
          }

      - name: Build MSIX
        if: github.event_name == 'push'
        env:
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER)) {
            throw 'STORE_PUBLISHER is required for the Store MSIX build.'
          }
          flutter pub run msix:create --store --publisher "$env:STORE_PUBLISHER" --install-certificate false --build-windows false

      - name: Package Windows build
        run: |
          cd build/windows/x64/runner/Release
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'dragexif-windows.zip'
          7z a "$zipPath" * -x!dragexif.msix
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $msixInZip = $zip.Entries | Where-Object FullName -eq 'dragexif.msix'
          } finally {
            $zip.Dispose()
          }
          if ($null -ne $msixInZip) {
            throw 'The portable Windows ZIP must not contain dragexif.msix.'
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragexif-windows
          path: dragexif-windows.zip

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dragexif-msix
          path: build/windows/x64/runner/Release/dragexif.msix

  release:
    needs: [build-linux, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dragexif-linux
          path: artifacts/

      - name: Download standalone Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dragexif-linux-standalone
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dragexif-windows
          path: artifacts/

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: dragexif-msix
          path: artifacts/

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/*
          make_latest: true
          generate_release_notes: true

  publish-flatpak:
    needs: [release]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder jq ostree
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Import repository signing key
        env:
          DRAGEXIF_FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.DRAGEXIF_FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DRAGEXIF_FLATPAK_GPG_PRIVATE_KEY"
          export GNUPGHOME="$RUNNER_TEMP/flatpak-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' 'pinentry-mode loopback' > "$GNUPGHOME/gpg.conf"
          printf '%s\n' 'allow-loopback-pinentry' > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$DRAGEXIF_FLATPAK_GPG_PRIVATE_KEY" \
            | gpg --batch --import
          key_id="$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$key_id"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "FLATPARK_GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Resolve current release asset
        id: release
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          release="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${version}")"
          asset='dragexif-linux_standalone.tar.gz'
          url="$(jq -r --arg asset "$asset" \
            '.assets[] | select(.name == $asset) | .browser_download_url' \
            <<<"$release")"
          test -n "$url" && test "$url" != null
          archive="$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 --retry-all-errors -o "$archive" "$url"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          size="$(stat -c%s "$archive")"
          date="$(jq -r '.published_at' <<<"$release" | cut -c1-10)"
          printf 'version=%s\nsha256=%s\nsize=%s\ndate=%s\n' \
            "$version" "$sha256" "$size" "$date" >> "$GITHUB_OUTPUT"

      - name: Generate Flatpak manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          SIZE: ${{ steps.release.outputs.size }}
          RELEASE_DATE: ${{ steps.release.outputs.date }}
        run: |
          set -euo pipefail
          sed \
            -e "s/@VERSION@/$VERSION/g" \
            -e "s/@SHA256@/$SHA256/g" \
            -e "s/@SIZE@/$SIZE/g" \
            flatpak/com.aipeac.dragexif.yml.in \
            > flatpak/com.aipeac.dragexif.yml
          sed \
            -e "s/@VERSION@/$VERSION/g" \
            -e "s/@DATE@/$RELEASE_DATE/g" \
            flatpak/com.aipeac.dragexif.metainfo.xml.in \
            > flatpak/com.aipeac.dragexif.metainfo.xml

      - name: Build and sign Flatpak repository
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/flatpak-repo"
          build="$RUNNER_TEMP/flatpak-build"
          flatpak-builder --force-clean \
            --repo="$repo" \
            --default-branch=stable \
            --gpg-sign="$FLATPARK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" \
            --install-deps-from=flathub \
            --user \
            "$build" flatpak/com.aipeac.dragexif.yml
          flatpak build-update-repo \
            --gpg-sign="$FLATPARK_GPG_KEY_ID" \
            --gpg-homedir="$GNUPGHOME" \
            --generate-static-deltas \
            "$repo"
          echo "FLATPARK_REPO=$repo" >> "$GITHUB_ENV"

      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/pages"
          mkdir -p "$pages/repo"
          cp -a "$FLATPARK_REPO/." "$pages/repo/"
          gpg --batch --armor --export "$FLATPARK_GPG_KEY_ID" > "$pages/flatpark.gpg"
          gpg_key="$(base64 -w0 "$pages/flatpark.gpg")"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          cat > "$pages/flatpark.flatpakrepo" <<EOF
          [Flatpak Repo]
          Title=Drag Exif
          Url=https://${owner}.github.io/${repository}/repo
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Comment=Drag Exif Flatpak repository
          Description=Signed Flatpak releases of Drag Exif.
          GPGKey=${gpg_key}
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Microsoft Store publishing is manual:
  # 1. Wait for CI to finish
  # 2. Download dragexif.msix from GitHub Releases
  # 3. Go to Partner Center → DragExif → Packages
  # 4. Drag and drop the .msix file
