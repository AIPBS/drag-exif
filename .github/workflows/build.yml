name: Build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'windows/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        run: |
          DART_CONSTRAINT=$(grep '^  sdk:' pubspec.yaml | sed 's/.*sdk: //')
          DART_VERSION=${DART_CONSTRAINT#\^}
          FLUTTER_VERSION=$(grep "^$DART_VERSION:" .flutter-versions | cut -d: -f2 | xargs)
          echo "dart=$DART_VERSION" >> $GITHUB_OUTPUT
          echo "flutter=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-${{ steps.flutter-version.outputs.flutter }}-${{ runner.os }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.flutter }}
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package Linux build
        run: |
          cd build/linux/x64/release
          tar czf "$(git rev-parse --show-toplevel)/dragexif-linux.tar.gz" bundle/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragexif-linux
          path: dragexif-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        shell: bash
        run: |
          DART_CONSTRAINT=$(grep '^  sdk:' pubspec.yaml | sed 's/.*sdk: //')
          DART_VERSION=${DART_CONSTRAINT#\^}
          FLUTTER_VERSION=$(grep "^$DART_VERSION:" .flutter-versions | cut -d: -f2 | xargs)
          echo "dart=$DART_VERSION" >> $GITHUB_OUTPUT
          echo "flutter=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: C:\\hostedtoolcache\\flutter
          key: flutter-${{ steps.flutter-version.outputs.flutter }}-${{ runner.os }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.flutter }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Download ExifTool
        shell: pwsh
        run: |
          $version = '13.59'
          $archive = Join-Path $env:RUNNER_TEMP "exiftool-$version-64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "exiftool-$version-64"
          $url = "https://oliverbetz.de/cms/files/Artikel/ExifTool-for-Windows/exiftool-${version}_64.zip"
          $expectedSha256 = '577257dd22baebe77157d905792d6ed2c5916cd03aa627f40b2175db12110ac6'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "ExifTool checksum mismatch: $actualSha256"
          }

          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $exifTool = Get-ChildItem -Path $extract -Filter 'ExifTool.exe' -Recurse | Select-Object -First 1
          $exifToolFiles = Get-ChildItem -Path $extract -Directory -Filter 'exiftool_files' -Recurse | Select-Object -First 1
          if ($null -eq $exifTool -or $null -eq $exifToolFiles) {
            throw 'The ExifTool archive did not contain the expected executable and support directory.'
          }

          $bundle = Join-Path $PWD 'windows/runner/exiftool'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item $exifTool.FullName (Join-Path $bundle 'exiftool.exe') -Force
          Copy-Item $exifToolFiles.FullName (Join-Path $bundle 'exiftool_files') -Recurse -Force

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Stage MSIX build
        run: |
          # Build already outputs to build/windows/x64/runner/Release/
          if (-not (Test-Path "build/windows/x64/runner/Release/dragexif.exe")) {
            Write-Host "dragexif.exe not found in build/windows/x64/runner/Release/" -ForegroundColor Red
            exit 1
          }
          if (-not (Test-Path "build/windows/x64/runner/Release/exiftool.exe")) {
            Write-Host "exiftool.exe not found in the Windows bundle" -ForegroundColor Red
            exit 1
          }
          if (-not (Test-Path "build/windows/x64/runner/Release/exiftool_files")) {
            Write-Host "exiftool_files not found in the Windows bundle" -ForegroundColor Red
            exit 1
          }

      - name: Build MSIX
        if: github.event_name == 'push'
        env:
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER)) {
            throw 'STORE_PUBLISHER is required for the Store MSIX build.'
          }
          flutter pub run msix:create --store --publisher "$env:STORE_PUBLISHER" --install-certificate false

      - name: Package Windows build
        run: |
          cd build/windows/x64/runner/Release
          7z a ../../../../../dragexif-windows.zip *

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragexif-windows
          path: dragexif-windows.zip

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dragexif-msix
          path: build/windows/x64/runner/Release/dragexif.msix

  release:
    needs: [build-linux, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dragexif-linux
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: dragexif-windows
          path: artifacts/

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: dragexif-msix
          path: artifacts/

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: artifacts/*
          make_latest: true
          generate_release_notes: true

  # Microsoft Store publishing is manual:
  # 1. Wait for CI to finish
  # 2. Download dragexif.msix from GitHub Releases
  # 3. Go to Partner Center → DragExif → Packages
  # 4. Drag and drop the .msix file
